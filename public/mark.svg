<svg xmlns="http://www.w3.org/2000/svg" viewBox="74 74 364 364">
  <!-- ODDIN 로고(투명 바탕): 앱 아이콘(desktop/build/tray.svg, 시안 B '엮인 O')과 같은 고리. 엮인 자리는 타일색 대신 마스크로 비워 어떤 바탕에도 놓인다 -->
  <defs>
    <linearGradient id="orange" gradientUnits="userSpaceOnUse" x1="0" y1="96" x2="0" y2="416">
      <stop offset="0" stop-color="#eb8b64"/>
      <stop offset="1" stop-color="#d06e4d"/>
    </linearGradient>
    <linearGradient id="blue" gradientUnits="userSpaceOnUse" x1="0" y1="96" x2="0" y2="416">
      <stop offset="0" stop-color="#74aaff"/>
      <stop offset="1" stop-color="#4f8fe8"/>
    </linearGradient>
    <mask id="under-orange" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="#fff"/>
      <path d="M305.93 118.80 A146 146 0 0 1 383.69 185.22" fill="none" stroke="#000" stroke-width="96" stroke-linecap="round"/>
    </mask>
    <mask id="under-blue" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="#fff"/>
      <path d="M218.21 397.03 A146 146 0 0 1 128.31 326.78" fill="none" stroke="#000" stroke-width="96" stroke-linecap="round"/>
    </mask>
  </defs>
  <g fill="none" stroke-linecap="round" stroke-width="72">
    <!-- 파랑(Codex) 큰 호: 우상단에서 주황 아래로 지나간다 -->
    <path d="M326.78 128.31 A146 146 0 1 1 128.31 326.78" stroke="url(#blue)" mask="url(#under-orange)"/>
    <!-- 주황(Claude) 호: 좌하단에서 파랑 아래로 지나간다 -->
    <path d="M383.69 185.22 A146 146 0 1 0 185.22 383.69" stroke="url(#orange)" mask="url(#under-blue)"/>
    <!-- 파랑이 좌하단에서 주황 위로 -->
    <path d="M281.35 399.78 A146 146 0 0 1 128.31 326.78" stroke="url(#blue)"/>
  </g>
</svg>
