<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Hub</title>
<!-- 프로그램을 켜고 허브에 연결하는 동안 보이는 화면 (desktop/main.cjs → showPage('loading')).
     허브 화면이 뜨면 바로 교체되므로 외부 자원 없이 이 파일 하나로 끝낸다.
     이 PC 허브가 꺼져 있으면 main 이 서버를 켜고 최대 20초쯤 기다리므로, 몇 초 뒤 보조 문구를 바꿔 준다. -->
<style>
:root{
  --bg:#141416;--fg:#ececee;--fg2:#b4b4bb;--muted:#82828c;--faint:#5c5c66;
  --claude:#d97757;--codex:#5b9cf5;
  --font:"Pretendard Variable",Pretendard,"Segoe UI Variable Text","Segoe UI","Malgun Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);overflow:hidden}
body{display:flex;align-items:center;justify-content:center;font:14.5px/1.6 var(--font);-webkit-font-smoothing:antialiased;padding:24px;user-select:none;-webkit-user-select:none}

.glow{position:fixed;left:50%;top:50%;width:560px;height:560px;max-width:140vw;transform:translate(-50%,-58%);pointer-events:none;
  background:radial-gradient(closest-side at 44% 50%,rgba(217,119,87,.075),transparent 72%),radial-gradient(closest-side at 58% 50%,rgba(91,156,245,.075),transparent 72%);filter:blur(12px)}

.stage{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;animation:fade .35s ease-out both}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* 로고: 허브 사이드바의 .mark(18px 원 두 개, 8px 겹침)를 같은 비율로 키운 것 */
.logo{position:relative;width:64px;height:44px;margin-bottom:20px}
.logo i{position:absolute;top:0;width:44px;height:44px;border-radius:50%}
.logo .c1{left:0;background:var(--claude);animation:meet-l 2.4s ease-in-out infinite}
.logo .c2{left:20px;background:var(--codex);opacity:.85;mix-blend-mode:screen;animation:meet-r 2.4s ease-in-out infinite}
@keyframes meet-l{0%,100%{transform:translateX(-5px)}50%{transform:translateX(0)}}
@keyframes meet-r{0%,100%{transform:translateX(5px)}50%{transform:translateX(0)}}

.word{font-weight:650;font-size:17px;letter-spacing:-.01em;margin-bottom:28px}
.status{margin:0;font-size:14px;color:var(--fg2);min-height:22px;transition:opacity .18s ease;word-break:keep-all}
.sub{margin:3px 0 0;font-size:12.5px;color:var(--muted);min-height:20px;transition:opacity .18s ease;word-break:keep-all}
.status.swap,.sub.swap{opacity:0}

.bar{position:relative;width:168px;height:3px;margin-top:20px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden}
.bar i{position:absolute;top:0;bottom:0;left:-40%;width:38%;border-radius:9px;background:linear-gradient(90deg,var(--claude),var(--codex));animation:slide 1.6s cubic-bezier(.45,0,.2,1) infinite}
@keyframes slide{0%{left:-40%}100%{left:104%}}

.foot{position:fixed;left:0;right:0;bottom:16px;text-align:center;font-size:11.5px;color:var(--faint)}

@media (prefers-reduced-motion:reduce){
  .stage{animation:none}
  .logo .c1,.logo .c2{animation:none;transform:none}
  .bar i{animation:none;left:0;width:100%;opacity:.45}
  .status,.sub{transition:none}
}
</style>
</head>
<body>
<div class="glow" aria-hidden="true"></div>
<main class="stage" aria-busy="true">
  <div class="logo" aria-hidden="true"><i class="c1"></i><i class="c2"></i></div>
  <div class="word">AI Hub</div>
  <p class="status" id="status" role="status" aria-live="polite">허브에 연결하는 중…</p>
  <p class="sub" id="sub" aria-hidden="true"></p>
  <div class="bar" role="progressbar" aria-label="허브 연결" aria-valuetext="연결하는 중"><i></i></div>
</main>
<p class="foot" id="foot" hidden></p>
<script>
(function () {
  'use strict';
  var status = document.getElementById('status');
  var sub = document.getElementById('sub');
  var foot = document.getElementById('foot');
  var isLocal = true;   // 지금 여는 허브가 이 PC 허브인지 (모르면 이 PC로 간주)
  var hubName = '';
  var timers = [];
  var seq = 0;          // init 을 다시 부르면 이전 getHubs 응답은 무시한다

  // 문구를 바꿀 때 짧게 사라졌다 나타나게 한다 (움직임 줄이기 설정이면 즉시 바꿈)
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function say(main, extra) {
    if (reduce) { status.textContent = main; sub.textContent = extra || ''; return; }
    status.classList.add('swap'); sub.classList.add('swap');
    timers.push(setTimeout(function () {
      status.textContent = main; sub.textContent = extra || '';
      status.classList.remove('swap'); sub.classList.remove('swap');
    }, 180));
  }
  function label() { return hubName ? (/허브$/.test(hubName) ? hubName : hubName + ' 허브') : '허브'; }

  function init() {
    var desk = window.hubDesktop || null;
    var my = ++seq;
    timers.forEach(clearTimeout); timers = [];
    isLocal = true; hubName = '';
    status.textContent = '허브에 연결하는 중…'; sub.textContent = '';
    status.classList.remove('swap'); sub.classList.remove('swap');

    // 프로그램 안이면 지금 여는 허브 이름·종류를 받아 문구에 반영한다. 실패해도 기본 문구로 계속 간다.
    if (desk && typeof desk.getHubs === 'function') {
      desk.getHubs().then(function (r) {
        if (my !== seq) return;
        var hubs = (r && Array.isArray(r.hubs)) ? r.hubs : [];
        var cur = null;
        for (var i = 0; i < hubs.length; i++) if (hubs[i].id === r.current) cur = hubs[i];
        if (!cur) return;
        isLocal = !!cur.local; hubName = String(cur.name || '');
        if (!isLocal) say(label() + '에 연결하는 중…');
      }).catch(function () {});
    }
    foot.hidden = !(desk && desk.version);
    foot.textContent = foot.hidden ? '' : '버전 ' + desk.version;

    // main.cjs: 이 PC 허브는 2.5초 안에 응답이 없으면 서버를 켜고 0.5초마다 최대 40번 다시 확인한다.
    timers.push(setTimeout(function () {
      if (isLocal) say('허브 서버를 시작하는 중이에요', '처음 켤 때는 몇 초 더 걸릴 수 있어요');
      else say(label() + '의 응답을 기다리는 중이에요', '상대 PC와 Tailscale 연결 상태에 따라 조금 걸릴 수 있어요');
    }, 3200));
    timers.push(setTimeout(function () {
      say('조금만 더 기다려 주세요', '연결되지 않으면 잠시 뒤 안내 화면으로 바뀌어요');
    }, 14000));
  }

  window.addEventListener('pagehide', function () { timers.forEach(clearTimeout); });
  window.loadingPage = { init: init };   // 시험용: window.hubDesktop 을 바꾼 뒤 처음부터 다시 돌릴 수 있다
  init();
})();
</script>
</body>
</html>
