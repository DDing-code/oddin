<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- ODDIN 시안 B — 엮인 O (앱 아이콘 512) -->
  <defs>
    <linearGradient id="tile" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="512">
      <stop offset="0" stop-color="#25262c"/>
      <stop offset="1" stop-color="#15161a"/>
    </linearGradient>
    <linearGradient id="rim" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="512">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.11"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="orange" gradientUnits="userSpaceOnUse" x1="0" y1="96" x2="0" y2="416">
      <stop offset="0" stop-color="#eb8b64"/>
      <stop offset="1" stop-color="#d06e4d"/>
    </linearGradient>
    <linearGradient id="blue" gradientUnits="userSpaceOnUse" x1="0" y1="96" x2="0" y2="416">
      <stop offset="0" stop-color="#74aaff"/>
      <stop offset="1" stop-color="#4f8fe8"/>
    </linearGradient>
    <radialGradient id="ivory" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#fff9ee"/>
      <stop offset="1" stop-color="#e5ddcc"/>
    </radialGradient>
    <radialGradient id="glowO" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d97757" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#d97757" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5b9cf5" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#5b9cf5" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#tile)"/>
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="url(#rim)" stroke-width="4"/>
  <circle cx="176" cy="176" r="220" fill="url(#glowO)"/>
  <circle cx="336" cy="336" r="220" fill="url(#glowB)"/>
  <g fill="none" stroke-linecap="round">
    <!-- 파랑 호: 우하단 반 (Codex) -->
    <path d="M328.72 124.81 A150 150 0 1 1 124.81 328.72" stroke="url(#blue)" stroke-width="56"/>
    <!-- 주황 호가 우상단에서 파랑 위로 지나감 (타일색 후광으로 아래위 구분) -->
    <path d="M307.30 115.05 A150 150 0 0 1 387.19 183.28" stroke="url(#tile)" stroke-width="80"/>
    <path d="M387.19 183.28 A150 150 0 1 0 183.28 387.19" stroke="url(#orange)" stroke-width="56"/>
    <!-- 파랑 호가 좌하단에서 주황 위로 지나감 -->
    <path d="M217.18 400.89 A150 150 0 0 1 124.81 328.72" stroke="url(#tile)" stroke-width="80"/>
    <path d="M282.05 403.72 A150 150 0 0 1 124.81 328.72" stroke="url(#blue)" stroke-width="56"/>
  </g>
</svg>
